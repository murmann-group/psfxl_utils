[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psfxl-utils"
version = "1.0.1"
description = "Decode Cadence Spectre PSF and PSFXL binary simulation results into NumPy arrays"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Calvin Lee", email = "cl66@hawaii.edu" },
    { name = "Ashtar Aggelopoulos" },
    { name = "Yuan Ma" },
    { name = "Boris Murmann" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "blosc",
    "packaging",
]
keywords = ["cadence", "spectre", "psf", "psfxl", "simulation", "eda", "waveform"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
# Alternative decompression backend for systems where blosc wheels are
# unavailable (e.g. some HPC environments); blosc itself is then optional.
numcodecs = ["numcodecs"]

[tool.setuptools]
packages = ["psfxl_utils"]
